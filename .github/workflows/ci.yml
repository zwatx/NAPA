name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e '.[headless,test]' ruff
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest --cov=napa_vision

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            opencv: "opencv-python-headless==4.7.0.72"
            numpy: "numpy<2"
          - python-version: "3.12"
            opencv: "opencv-python-headless>=4.7"
            numpy: "numpy>=1.24"
          - python-version: "3.13"
            opencv: "opencv-python-headless>=4.7"
            numpy: "numpy>=1.24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install '${{ matrix.numpy }}' '${{ matrix.opencv }}' -e '.[test]'
      - run: pytest

  native-core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[headless,test]"
      - run: python -c "import napa_vision; assert napa_vision.native_available(), 'native core did not build'"
      - run: pytest tests/test_napa_detector.py

  c-library:
    # The core on its own, as C and C++ programs build it: CMake, no Python in the library.
    name: c-library (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows-msvc
            os: windows-latest
          # clang-cl compiles the SIMD dispatch the way clang does but links MSVC's runtime
          - name: windows-clang-cl
            os: windows-latest
            cmake-flags: -G Ninja -DCMAKE_C_COMPILER=clang-cl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: cmake -S . -B build -DNAPA_BUILD_EXAMPLES=ON ${{ matrix.cmake-flags }}
      - run: cmake --build build --config Release
      - run: cmake --install build --config Release --prefix install
      - run: python -m pip install -e .
      - name: The C example finds a drawn tag
        shell: bash
        run: |
          python -c "
          import numpy as np
          from napa_vision.tags import tag_image
          image = np.full((240, 320), 255, np.uint8)
          image[40:160, 60:180] = tag_image(7, cell_px=12)
          open('tag.pgm', 'wb').write(b'P5 320 240 255\n' + image.tobytes())
          "
          example=$(find build -name 'napa_detect_pgm*' -type f | grep -E 'napa_detect_pgm(\.exe)?$' | head -1)
          "$example" tag.pgm | tee found.txt
          grep -q '^id 7 hamming 0 ' found.txt

  native-sanitizers:
    # The C core reads untrusted camera frames: fuzz every entry point and run the detector tests under
    # AddressSanitizer and UndefinedBehaviorSanitizer, with the SIMD paths and the scalar fallbacks.
    runs-on: ubuntu-latest
    env:
      SAN_FLAGS: -std=c99 -g -O1 -pthread -fno-wrapv -fno-omit-frame-pointer -fno-sanitize-recover=undefined
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Strict compile at C99 and C17 (-pedantic -Werror), as projects that vendor the core build it
        run: |
          for std in c99 gnu17; do
            for simd in "" "-DNAPA_NO_SIMD"; do
              gcc -std=$std $simd -pedantic -Werror -Wall -Wextra -Wformat=2 -pthread -fsyntax-only \
                src/napa_vision/_native/napa_core.c
            done
          done
      - name: Random fuzz driver, SIMD and scalar (gcc, ASan + UBSan)
        run: |
          for simd in "" "-DNAPA_NO_SIMD"; do
            gcc $SAN_FLAGS -fsanitize=address,undefined $simd tests/fuzz/napa_fuzz.c src/napa_vision/_native/napa_core.c \
              -lm -o napa_fuzz_driver
            ./napa_fuzz_driver 3000
          done
      - name: libFuzzer, two minutes (clang, ASan + UBSan)
        run: |
          clang $SAN_FLAGS -fsanitize=fuzzer,address,undefined -DNAPA_LIBFUZZER tests/fuzz/napa_fuzz.c \
            src/napa_vision/_native/napa_core.c -lm -o napa_fuzz
          ./napa_fuzz -max_total_time=120 -max_len=8192 -timeout=20
      - name: Detector tests on a sanitized core
        run: |
          python -m pip install -e ".[headless,test]"
          gcc $SAN_FLAGS -fsanitize=address,undefined -fvisibility=hidden -fPIC -shared -Isrc/napa_vision/_native \
            src/napa_vision/_native/napa_core.c -lm -o napa_asan.so
          LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libubsan.so)" \
            ASAN_OPTIONS=detect_leaks=0 NAPA_CORE_LIBRARY="$PWD/napa_asan.so" pytest tests/test_napa_detector.py

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: >-
          python -c 'import email, glob, zipfile;
          wheel=glob.glob("dist/*.whl")[0];
          archive=zipfile.ZipFile(wheel);
          metadata=email.message_from_bytes(archive.read(next(name for name in archive.namelist() if name.endswith("METADATA"))));
          assert {"gui", "headless"} <= set(metadata.get_all("Provides-Extra", []))'
      - run: python -m venv /tmp/napa-wheel
      # The detector itself needs only numpy: check it before OpenCV is installed.
      - run: /tmp/napa-wheel/bin/python -m pip install dist/*.whl
      - run: >-
          cd /tmp && /tmp/napa-wheel/bin/python -c 'import sys, numpy as np; sys.modules["cv2"] = None;
          from napa_vision import NapaDetector; assert NapaDetector().detect(np.zeros((64, 64, 3), np.uint8)) == []'
      - run: /tmp/napa-wheel/bin/python -m pip install opencv-python-headless
      - run: cd /tmp && /tmp/napa-wheel/bin/napa-benchmark --help
      - run: cd /tmp && /tmp/napa-wheel/bin/napa-calibrate --help
      - run: cd /tmp && /tmp/napa-wheel/bin/napa-tag 0-3 --output /tmp/napa-tags && ls /tmp/napa-tags/tag36h11-003.svg
      - run: python -m venv /tmp/napa-sdist
      - run: /tmp/napa-sdist/bin/python -m pip install --no-deps dist/*.tar.gz
      - run: /tmp/napa-sdist/bin/python -c 'import importlib.metadata; assert importlib.metadata.version("napa-vision")'
      - run: /tmp/napa-sdist/bin/python -m pip install numpy
      - run: cd /tmp && /tmp/napa-sdist/bin/python -c 'import napa_vision; assert napa_vision.native_available()'
      - uses: actions/upload-artifact@v4
        with:
          name: napa-vision-dist
          path: dist/*

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e '.[headless,test]' ruff
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest --cov=napa_vision

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            opencv: "opencv-python-headless==4.7.0.72"
            numpy: "numpy<2"
          - python-version: "3.12"
            opencv: "opencv-python-headless>=4.7"
            numpy: "numpy>=1.24"
          - python-version: "3.13"
            opencv: "opencv-python-headless>=4.7"
            numpy: "numpy>=1.24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install '${{ matrix.numpy }}' '${{ matrix.opencv }}' -e '.[test]'
      - run: pytest

  native-core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[headless,test]"
      - run: python -c "import napa_vision; assert napa_vision.native_available(), 'native core did not build'"
      - run: pytest tests/test_napa_detector.py

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: >-
          python -c 'import email, glob, zipfile;
          wheel=glob.glob("dist/*.whl")[0];
          archive=zipfile.ZipFile(wheel);
          metadata=email.message_from_bytes(archive.read(next(name for name in archive.namelist() if name.endswith("METADATA"))));
          assert {"gui", "headless"} <= set(metadata.get_all("Provides-Extra", []))'
      - run: python -m venv /tmp/napa-wheel
      # The detector itself needs only numpy: check it before OpenCV is installed.
      - run: /tmp/napa-wheel/bin/python -m pip install dist/*.whl
      - run: >-
          cd /tmp && /tmp/napa-wheel/bin/python -c 'import sys, numpy as np; sys.modules["cv2"] = None;
          from napa_vision import NapaDetector; assert NapaDetector().detect(np.zeros((64, 64, 3), np.uint8)) == []'
      - run: /tmp/napa-wheel/bin/python -m pip install opencv-python-headless
      - run: cd /tmp && /tmp/napa-wheel/bin/napa-benchmark --help
      - run: cd /tmp && /tmp/napa-wheel/bin/napa-calibrate --help
      - run: python -m venv /tmp/napa-sdist
      - run: /tmp/napa-sdist/bin/python -m pip install --no-deps dist/*.tar.gz
      - run: /tmp/napa-sdist/bin/python -c 'import importlib.metadata; assert importlib.metadata.version("napa-vision")'
      - run: /tmp/napa-sdist/bin/python -m pip install numpy
      - run: cd /tmp && /tmp/napa-sdist/bin/python -c 'import napa_vision; assert napa_vision.native_available()'
      - uses: actions/upload-artifact@v4
        with:
          name: napa-vision-dist
          path: dist/*

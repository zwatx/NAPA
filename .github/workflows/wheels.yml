name: Wheels

# Prebuilt wheels, so installing Napa needs no C compiler. Each wheel is py3-none-<platform> (the
# library is loaded with ctypes), so one build per platform serves every Python 3. The sdist still
# builds from source.
#
# Pushing a v* tag also publishes to PyPI, through PyPI's trusted publishing (no API token): on PyPI,
# add a trusted publisher for this repository, workflow wheels.yml, environment "pypi". Running the
# workflow by hand builds without publishing. A v* tag also attaches the Android C library (for apps,
# such as Meta Quest ones) to the tag's GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native runners for each architecture: no emulation.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.3.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  android-wheels:
    # Android ARM64 (phones, Meta Quest) and x86_64 (emulators). The tests run the x86_64 wheel on an
    # emulator, which needs KVM.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_PLATFORM: android
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-android
          path: wheelhouse/*.whl

  android-library:
    # The C core for Android apps: libnapa.so, its header, and a CMake package, for arm64-v8a.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/napa_vision/_version.py)
          name=napa-$version-android-arm64-v8a
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=24 -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DBUILD_SHARED_LIBS=ON
          cmake --build build-android
          cmake --install build-android --prefix "$name" --strip
          file "$name/lib/libnapa.so" | grep -q "ARM aarch64"
          zip -r "$name.zip" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: android-library
          path: napa-*-android-arm64-v8a.zip

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, android-wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/napa-vision
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: rm -f dist/*.zip && ls -l dist # the Android library goes to the GitHub release, not PyPI
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [android-library, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the Android library
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-library
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" napa-*-android-arm64-v8a.zip --repo "$GITHUB_REPOSITORY" --clobber

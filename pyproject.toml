[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napa-vision"
dynamic = ["version"]
description = "Fast, camera-agnostic AprilTag detection and pose processing"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["apriltag", "computer-vision", "frc", "networktables", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/Zw96042/apriltag-detector"
Repository = "https://github.com/Zw96042/apriltag-detector.git"
Issues = "https://github.com/Zw96042/apriltag-detector/issues"

[project.optional-dependencies]
gui = ["opencv-python>=4.7"]
headless = ["opencv-python-headless>=4.7"]
nt = ["pyntcore>=2024"]
benchmark = ["robotpy-apriltag==2026.2.2"]
test = [
    "pytest>=8,<10",
    "pytest-cov>=5",
]
dev = [
    "build>=1.2",
    "pytest>=8,<10",
    "pytest-cov>=5",
    "ruff>=0.11",
    "twine>=5",
]

[project.scripts]
napa-vision = "napa_vision.cli:main"
napa-benchmark = "napa_vision.benchmark:main"
napa-calibrate = "napa_vision.workflows:calibration_main"
napa-layout = "napa_vision.workflows:layout_main"
napa-simulate = "napa_vision.simulation_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["napa_vision*"]

[tool.setuptools.package-data]
napa_vision = ["py.typed", "profiles/*.json"]

[tool.setuptools.dynamic]
version = { attr = "napa_vision._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["napa_vision"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "napa-vision"
dynamic = ["version"]
description = "Napa: a fast, dependency-free tag36h11 AprilTag detector with optional pose processing"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
authors = [{ name = "Zachary Wilson" }]
requires-python = ">=3.11"
keywords = ["apriltag", "computer-vision", "fiducial", "pose-estimation", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/zwatx/NAPA"
Repository = "https://github.com/zwatx/NAPA.git"
Issues = "https://github.com/zwatx/NAPA/issues"

[project.optional-dependencies]
gui = ["opencv-python>=4.7"]
headless = ["opencv-python-headless>=4.7"]
benchmark = ["robotpy-apriltag==2026.2.2"]
test = [
    "pytest>=8,<10",
    "pytest-cov>=5",
]
dev = [
    "build>=1.2",
    "pytest>=8,<10",
    "pytest-cov>=5",
    "ruff>=0.11",
    "twine>=5",
]

[project.scripts]
napa-benchmark = "napa_vision.benchmark:main"
napa-calibrate = "napa_vision.workflows:calibration_main"
napa-tag = "napa_vision.workflows:tag_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["napa_vision*"]

[tool.setuptools.package-data]
napa_vision = ["py.typed"]

# The C sources and code tables are built into the library: the sdist carries them, wheels don't need them.
[tool.setuptools.exclude-package-data]
"napa_vision._native" = ["*.c", "*.h", "families/*.h"]
"napa_vision._native.families" = ["*.h"]

[tool.setuptools.dynamic]
version = { attr = "napa_vision._version.__version__" }

[tool.cibuildwheel]
# Wheels are py3-none-<platform> (see setup.py), so one CPython build per platform covers every Python 3.
# Android's first official CPython is 3.13.
build = ["cp311-*", "cp313-android_*"]
skip = "*-musllinux_*"
test-requires = ["pytest", "opencv-python-headless"]
test-sources = ["tests"]
test-command = "pytest tests/test_napa_detector.py"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.android]
# arm64_v8a for phones and Meta Quest headsets; x86_64 for emulators. Tests run on an emulator of the build
# machine's architecture, so CI tests x86_64. PyPI has no Android NumPy or OpenCV: NumPy comes from
# Chaquopy's index, and the tests need only Napa and NumPy. Chaquopy's NumPy links libc++_shared,
# libgfortran, and libopenblas, which Chaquopy's own runtime puts on the library path; the plain test app
# doesn't, so the test command loads them first.
archs = ["arm64_v8a", "x86_64"]
environment = { PIP_EXTRA_INDEX_URL = "https://chaquo.com/pypi-13.1" }
test-requires = ["pytest"]
test-sources = ["tests/test_mobile.py"]
test-command = '''python -c "import ctypes, pathlib, sys, chaquopy, pytest; lib = pathlib.Path(list(chaquopy.__path__)[0], 'lib'); [ctypes.CDLL(str(lib / name), ctypes.RTLD_GLOBAL) for name in ('libc++_shared.so', 'libgfortran.so.3', 'libopenblas.so')]; sys.exit(pytest.main(['tests/test_mobile.py']))"'''

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["napa_vision"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

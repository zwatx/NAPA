[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-vision"
dynamic = ["version"]
description = "AprilTag detection and Northstar-compatible pose publishing"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["apriltag", "computer-vision", "frc", "networktables", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.7",
]

[project.optional-dependencies]
nt = ["pyntcore>=2024"]
test = [
    "pytest>=8,<10",
    "pytest-cov>=5",
]
dev = [
    "build>=1.2",
    "pytest>=8,<10",
    "pytest-cov>=5",
    "ruff>=0.11",
    "twine>=5",
]

[project.scripts]
northstar-vision = "northstar_vision.cli:main"
northstar-benchmark = "northstar_vision.benchmark:main"
northstar-calibrate = "northstar_vision.workflows:calibration_main"
northstar-layout = "northstar_vision.workflows:layout_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["northstar_vision*"]

[tool.setuptools.package-data]
northstar_vision = ["py.typed", "profiles/*.json"]

[tool.setuptools.dynamic]
version = { attr = "northstar_vision._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["northstar_vision"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60
